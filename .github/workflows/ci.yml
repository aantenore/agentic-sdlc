name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"os":["ubuntu-latest","macos-latest","windows-latest"],"node":[24],"include":[{"os":"ubuntu-latest","node":"18.20.3"}]}' || '{"os":["ubuntu-latest","macos-latest","windows-latest"],"node":["18.20.3","20.12.0","21.6.0",24]}') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.14"
          update-environment: false
      - run: npm run check
      - name: Verify bounded test-runner bootstrap
        run: node --test test/unit/test-suite-runner.test.mjs
      - run: npm test
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          AGENTIC_SDLC_TEST_CONCURRENCY: ${{ matrix.os == 'macos-latest' && matrix.node == '18.20.3' && '1' || matrix.os == 'ubuntu-latest' && '4' || '2' }}
      - name: Enforce enterprise performance on the required reference runtime
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run benchmark:enterprise
      - run: npm run doctor
      - run: npm pack --dry-run
